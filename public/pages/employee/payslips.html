<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payslips - Gensar HRMS</title>
    <link rel="icon" type="image/png" href="../../assets/images/fav-icon.png">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .payslip-row-label { color: var(--text-secondary); font-size: 0.9rem; }
        .payslip-row-value { font-weight: 600; font-size: 0.95rem; text-align: right; }
        .payslip-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
        .payslip-row:last-child { border-bottom: none; }
        .payslip-row.total { border-top: 2px solid var(--border); border-bottom: none; padding-top: 16px; margin-top: 4px; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-building" style="color:var(--primary-light);font-size:1.5rem;"></i><span style="font-size:1rem;font-weight:700;">Gensar HRMS</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="/pages/employee/dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a>
            <div class="nav-section-title">My Info</div>
            <a href="/pages/employee/profile.html" class="nav-item"><i class="fas fa-user"></i><span class="nav-text">My Profile</span></a>
            <a href="/pages/employee/attendance.html" class="nav-item"><i class="fas fa-clock"></i><span class="nav-text">Attendance</span></a>
            <a href="/pages/employee/leave.html" class="nav-item"><i class="fas fa-calendar-times"></i><span class="nav-text">Leave</span></a>
            <a href="/pages/employee/wfh.html" class="nav-item"><i class="fas fa-home"></i><span class="nav-text">Work From Home</span></a>
            <a href="/pages/employee/payslips.html" class="nav-item active"><i class="fas fa-money-bill-wave"></i><span class="nav-text">Payslips</span></a>
            <div class="nav-section-title">Support</div>
            <a href="/pages/employee/tickets.html" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">My Queries</span></a>
            <div class="nav-section-title">Resources</div>
            <a href="/pages/employee/documents.html" class="nav-item"><i class="fas fa-file-alt"></i><span class="nav-text">Documents</span></a>
            <a href="/pages/employee/announcements.html" class="nav-item"><i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span></a>
            <a href="/pages/employee/holidays.html" class="nav-item"><i class="fas fa-calendar-check"></i><span class="nav-text">Holidays</span></a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">My Payslips</h2>
            </div>
            <div class="header-right">
                <button type="button" class="notification-btn" title="Notifications"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>
                <button class="notification-btn" onclick="toggleDarkMode()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
                <div style="position:relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="profile-photo" id="profilePhoto" style="display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:white;border-radius:50%;width:36px;height:36px;font-size:0.8rem;font-weight:600;"></span>
                        <span id="profileName" style="margin-left:8px;font-weight:500;"></span>
                        <i class="fas fa-chevron-down" style="margin-left:4px;font-size:0.7rem;"></i>
                    </button>
                    <div class="profile-menu" id="profileMenu" style="display:none;">
                        <a href="/pages/employee/profile.html" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <div style="padding:30px;">
            <div class="card slide-up stagger-1">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <h3 style="font-weight:600;"><i class="fas fa-file-invoice-dollar" style="color:var(--secondary);margin-right:8px;"></i>Salary Statements</h3>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <select id="filterMonth" class="form-control" style="width:auto;" onchange="loadData()"></select>
                        <input type="number" id="filterYear" class="form-control" style="width:100px;" onchange="loadData()">
                    </div>
                </div>
                <div id="tableContainer">
                    <div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content" style="max-width:550px;">
            <div class="modal-header">
                <h2>Payslip Detail</h2>
                <button onclick="closeModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary);">&times;</button>
            </div>
            <div class="modal-body" id="payslipDetail"></div>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/tickets.js"></script>
    <script>
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const fullMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) throw new Error('Not authenticated');
            const select = document.getElementById('filterMonth');
            for (let i = 0; i < 12; i++) {
                const opt = document.createElement('option');
                opt.value = i + 1;
                opt.textContent = months[i];
                select.appendChild(opt);
            }
            const now = new Date();
            select.value = now.getMonth() + 1;
            document.getElementById('filterYear').value = now.getFullYear();
            loadData();
        });

        async function loadData() {
            const month = document.getElementById('filterMonth').value;
            const year = document.getElementById('filterYear').value;
            const data = await apiCall(`/payroll/my?month=${month}&year=${year}`);
            const container = document.getElementById('tableContainer');

            if (data && data.success) {
                if (!data.payslips || data.payslips.length === 0) {
                    showEmptyState(container, 'fa-file-invoice-dollar', 'No Payslips', 'No payslips found for this period');
                    return;
                }
                let html = '<div class="table-container"><table><thead><tr><th>Period</th><th>Basic Salary</th><th>Allowances</th><th>Deductions</th><th style="text-align:right;">Net Pay</th><th>Status</th><th>Action</th></tr></thead><tbody>';
                data.payslips.forEach(p => {
                    html += '<tr>';
                    html += '<td style="font-weight:500;">' + fullMonths[p.month - 1] + ' ' + p.year + '</td>';
                    html += '<td>' + formatCurrency(p.basic_salary) + '</td>';
                    html += '<td style="color:var(--secondary);">+' + formatCurrency(p.allowances || 0) + '</td>';
                    html += '<td style="color:var(--danger);">-' + formatCurrency(p.deductions || 0) + '</td>';
                    html += '<td style="text-align:right;"><strong style="color:var(--secondary);font-size:1rem;">' + formatCurrency(p.net_salary) + '</strong></td>';
                    html += '<td><span class="badge badge-' + getStatusBadge(p.status) + '">' + escapeHtml(p.status || '-') + '</span></td>';
                    html += '<td><div style="display:flex;gap:4px;"><button class="btn btn-sm btn-secondary" onclick="viewPayslip(' + p.id + ')"><i class="fas fa-eye"></i> View</button><button class="btn btn-sm btn-info" onclick="downloadPayslipPdf(' + p.id + ')" title="Download PDF"><i class="fas fa-download"></i> PDF</button></div></td>';
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                container.innerHTML = html;
            } else {
                showEmptyState(container, 'fa-exclamation-triangle', 'Error', 'Failed to load payslips');
            }
        }

        async function viewPayslip(id) {
            const data = await apiCall(`/payroll/${id}`);
            if (data && data.success) {
                const p = data.payslip;
                let html = '<div style="text-align:center;margin-bottom:24px;">';
                html += '<div style="font-size:1.3rem;font-weight:700;color:var(--primary);">' + escapeHtml(p.company_name || 'Gensar IT Solutions') + '</div>';
                html += '<div style="color:var(--text-secondary);font-size:0.95rem;margin-top:4px;">Payslip for ' + fullMonths[p.month - 1] + ' ' + p.year + '</div>';
                html += '</div>';
                html += '<div class="divider"></div>';
                html += '<div style="margin:16px 0;">';
                html += '<div class="payslip-row"><span class="payslip-row-label">Basic Salary</span><span class="payslip-row-value">' + formatCurrency(p.basic_salary) + '</span></div>';
                html += '<div class="payslip-row"><span class="payslip-row-label">Allowances</span><span class="payslip-row-value" style="color:var(--secondary);">+' + formatCurrency(p.allowances || 0) + '</span></div>';
                html += '<div class="payslip-row"><span class="payslip-row-label">Deductions</span><span class="payslip-row-value" style="color:var(--danger);">-' + formatCurrency(p.deductions || 0) + '</span></div>';
                html += '<div class="payslip-row total"><span class="payslip-row-label" style="font-weight:700;font-size:1rem;">Net Salary</span><span class="payslip-row-value" style="color:var(--secondary);font-size:1.2rem;">' + formatCurrency(p.net_salary) + '</span></div>';
                html += '</div>';
                html += '<div style="text-align:center;margin-top:16px;"><span class="badge badge-' + getStatusBadge(p.status) + '" style="font-size:0.8rem;padding:6px 16px;">' + escapeHtml((p.status || '').toUpperCase()) + '</span></div>';
                if (p.payment_date) {
                    html += '<div style="text-align:center;margin-top:10px;color:var(--text-secondary);font-size:0.85rem;">Payment Date: ' + formatDate(p.payment_date) + '</div>';
                }
                document.getElementById('payslipDetail').innerHTML = html;
                document.getElementById('modal').classList.add('active');
            } else {
                showToast('Failed to load payslip details', 'error');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
</html>

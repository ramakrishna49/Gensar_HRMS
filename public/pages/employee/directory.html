<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Employee Directory - Gensar HRMS</title>
    <link rel="icon" type="image/png" href="../../assets/images/fav-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
        .dir-card { padding: 16px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-md); }
        .dir-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .dir-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }
        .dir-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
        .dir-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .dir-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; overflow-wrap: anywhere; }
        .dir-row i { width: 16px; text-align: center; color: var(--primary); flex-shrink: 0; }
    </style>
</head>
<body class="employee-app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-building" style="color:var(--primary-light);font-size:1.5rem;"></i><span style="font-size:1rem;font-weight:700;">Gensar HRMS</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="/pages/employee/dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a>
            <a href="/pages/manager/my-team.html" id="myTeamLink" style="display:none;" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">My Team</span></a>
            <div class="nav-section-title">My Info</div>
            <a href="/pages/employee/profile.html" class="nav-item"><i class="fas fa-user"></i><span class="nav-text">My Profile</span></a>
            <a href="/pages/employee/attendance.html" class="nav-item"><i class="fas fa-clock"></i><span class="nav-text">Attendance</span></a>
            <a href="/pages/employee/regularization.html" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">Regularization</span></a>
            <a href="/pages/employee/leave.html" class="nav-item"><i class="fas fa-calendar-times"></i><span class="nav-text">Leave</span></a>
            <a href="/pages/employee/wfh.html" class="nav-item"><i class="fas fa-home"></i><span class="nav-text">WFH</span></a>
            <a href="/pages/employee/payslips.html" class="nav-item"><i class="fas fa-indian-rupee-sign"></i><span class="nav-text">Payslips</span></a>
            <div class="nav-section-title">Company</div>
            <a href="/pages/employee/directory.html" class="nav-item active"><i class="fas fa-address-book"></i><span class="nav-text">Directory</span></a>
            <a href="/pages/employee/holidays.html" class="nav-item"><i class="fas fa-calendar-check"></i><span class="nav-text">Holidays</span></a>
            <div class="nav-section-title">Support</div>
            <a href="/pages/employee/tickets.html" class="nav-item"><i class="fas fa-ticket-alt"></i><span class="nav-text">My Queries</span></a>
            <div class="nav-section-title">Resources</div>
            <a href="/pages/employee/documents.html" class="nav-item"><i class="fas fa-file-alt"></i><span class="nav-text">Documents</span></a>
            <a href="/pages/employee/announcements.html" class="nav-item"><i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span></a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 style="font-size:1.25rem;font-weight:600;">Employee Directory</h2>
            </div>
            <div class="header-right">
                <button type="button" class="notification-btn" title="Notifications"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge" style="display:none;"></span></button>
                <button class="notification-btn" onclick="toggleDarkMode()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
                <div style="position:relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="profile-photo" id="profilePhoto" style="display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:white;border-radius:50%;width:36px;height:36px;font-size:0.8rem;font-weight:600;"></span>
                        <span id="profileName" style="margin-left:8px;font-weight:500;"></span>
                        <i class="fas fa-chevron-down" style="margin-left:4px;font-size:0.7rem;"></i>
                    </button>
                    <div class="profile-menu" id="profileMenu" style="display:none;">
                        <a href="/pages/employee/profile.html" class="profile-menu-item"><i class="fas fa-user"></i> My Profile</a>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
                <input type="text" id="dirSearch" class="form-control" placeholder="Search by name, ID, email, department..." style="max-width:380px;" oninput="renderDirectory()">
                <select id="dirDept" class="form-control" style="width:auto;min-width:170px;" onchange="renderDirectory()">
                    <option value="">All Departments</option>
                </select>
            </div>

            <div id="dirGrid" class="dir-grid">
                <div style="text-align:center;padding:60px;grid-column:1/-1;"><div class="spinner" style="margin:0 auto;"></div></div>
            </div>
            <div id="dirCount" style="font-size:0.82rem;color:var(--text-secondary);margin-top:14px;"></div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        if (!checkAuth()) throw new Error('Not authenticated');

        let directory = [];
        let dirScope = 'company';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (user && (user.role === 'manager' || user.role === 'team_lead')) {
                const link = document.getElementById('myTeamLink');
                // Must match .nav-item's flex layout - using 'block' would
                // collapse the icon/text gap defined by the stylesheet.
                if (link) link.style.display = 'flex';
            }
            await loadDirectory();
        });

        async function loadDirectory() {
            const data = await apiCall('/employees/directory');
            const grid = document.getElementById('dirGrid');
            if (data && data.success) {
                directory = data.directory || [];
                dirScope = data.scope || 'company';

                // Populate the department filter from the data itself.
                const depts = [...new Set(directory.map(e => e.department_name).filter(Boolean))].sort();
                const sel = document.getElementById('dirDept');
                depts.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    sel.appendChild(opt);
                });

                renderDirectory();
            } else {
                showEmptyState(grid, 'fa-address-book', 'Error', 'Failed to load the directory');
            }
        }

        function renderDirectory() {
            const q = document.getElementById('dirSearch').value.toLowerCase().trim();
            const dept = document.getElementById('dirDept').value;

            let list = directory;
            if (dept) list = list.filter(e => e.department_name === dept);
            if (q) {
                list = list.filter(e =>
                    ((e.first_name || '') + ' ' + (e.last_name || '')).toLowerCase().includes(q) ||
                    (e.employee_id || '').toLowerCase().includes(q) ||
                    (e.personal_email || '').toLowerCase().includes(q) ||
                    (e.phone || '').toLowerCase().includes(q) ||
                    (e.department_name || '').toLowerCase().includes(q) ||
                    (e.designation_name || '').toLowerCase().includes(q)
                );
            }

            const grid = document.getElementById('dirGrid');
            if (list.length === 0) {
                showEmptyState(grid, 'fa-user-slash', 'No Results', 'No employees match your search');
                document.getElementById('dirCount').textContent = '';
                return;
            }

            grid.innerHTML = list.map(e => {
                const initials = getInitials(e.first_name, e.last_name);
                const emailLink = e.personal_email
                    ? '<a href="mailto:' + encodeURIComponent(e.personal_email) + '" style="color:inherit;text-decoration:none;">' + escapeHtml(e.personal_email) + '</a>'
                    : '—';
                const phoneLink = e.phone
                    ? '<a href="tel:' + escapeHtml(String(e.phone).replace(/[^0-9+]/g, '')) + '" style="color:inherit;text-decoration:none;">' + escapeHtml(e.phone) + '</a>'
                    : '—';
                return '<div class="dir-card">' +
                    '<div class="dir-head">' +
                        '<div class="dir-avatar">' + escapeHtml(initials) + '</div>' +
                        '<div>' +
                            '<div class="dir-name">' + escapeHtml((e.first_name || '') + ' ' + (e.last_name || '')) + '</div>' +
                            '<div class="dir-sub">' + escapeHtml(e.employee_id || '') +
                                (e.designation_name ? ' · ' + escapeHtml(e.designation_name) : '') + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="dir-row"><i class="fas fa-building"></i>' + escapeHtml(e.department_name || '—') + '</div>' +
                    '<div class="dir-row"><i class="fas fa-envelope"></i>' + emailLink + '</div>' +
                    '<div class="dir-row"><i class="fas fa-phone"></i>' + phoneLink + '</div>' +
                    (e.reporting_manager ? '<div class="dir-row"><i class="fas fa-user-tie"></i>Reports to: ' + escapeHtml(e.reporting_manager) + '</div>' : '') +
                '</div>';
            }).join('');

            const unit = dirScope === 'team' ? 'team members' : 'employees';
            document.getElementById('dirCount').textContent = 'Showing ' + list.length + ' of ' + directory.length + ' ' + unit;
        }
    </script>
</body>
</html>

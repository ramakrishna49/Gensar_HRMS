<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gensar HRMS</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <img src="../assets/images/gensar_logo.png" alt="Gensar HRMS Logo" style="width:100px;height:auto;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <i class="fas fa-shield-halved" style="display:none;font-size:2rem;"></i>
                </div>
                <h1>Gensar HRMS</h1>
                <p>Administrator Portal</p>
            </div>
            
            <form class="login-form" onsubmit="handleLogin(event, 'admin')">
                <div class="form-group">
                    <label>Employee ID or Email</label>
                    <div class="input-icon">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" class="form-control" id="employeeId" placeholder="Enter email" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Sign In to Admin
                </button>
            </form>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
</body>
</html>

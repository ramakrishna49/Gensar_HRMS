<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gensar HRMS — Office Display</title>
    <link rel="icon" type="image/png" href="/assets/images/fav-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1100px 500px at 75% -10%, rgba(99, 102, 241, 0.22), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(168, 85, 247, 0.14), transparent 60%),
                #0a0f1e;
            color: #E5E9F2;
            display: flex;
            flex-direction: column;
            padding: 3vh 3vw 0;
        }
        body.idle { cursor: none; }

        /* ---------- header ---------- */
        header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex: 0 0 auto; }
        .brand { display: flex; align-items: center; gap: 18px; }
        .brand img { width: 58px; height: 58px; object-fit: contain; border-radius: 12px; background: #fff; padding: 6px; }
        .brand-name { font-size: clamp(20px, 2.2vw, 34px); font-weight: 800; letter-spacing: .5px; }
        .brand-sub { font-size: clamp(11px, 1vw, 15px); color: #8B93A7; letter-spacing: 2.5px; text-transform: uppercase; margin-top: 4px; }
        .clock-wrap { text-align: right; }
        .clock {
            font-size: clamp(44px, 6vw, 96px); font-weight: 900; line-height: 1;
            background: linear-gradient(135deg, #A5B4FC, #C084FC);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            font-variant-numeric: tabular-nums;
        }
        .date-line { font-size: clamp(14px, 1.4vw, 22px); color: #AEB6C8; margin-top: 6px; font-weight: 600; }

        /* ---------- cards ---------- */
        main { flex: 1 1 auto; display: grid; grid-template-columns: 1.1fr 1fr 1fr; grid-template-rows: 1fr auto; gap: 2.2vh 1.4vw; padding: 3.5vh 0 2.5vh; min-height: 0; }
        .card {
            background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09);
            border-radius: 22px; padding: 2.6vh 1.6vw; display: flex; flex-direction: column;
            justify-content: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        .card-label { font-size: clamp(11px, 1.05vw, 16px); letter-spacing: 3px; text-transform: uppercase; color: #8B93A7; font-weight: 600; margin-bottom: 1.6vh; }
        .hero { grid-row: span 2; }
        .hero-num { font-size: clamp(56px, 7.5vw, 130px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .hero-num small { font-size: 0.38em; color: #8B93A7; font-weight: 700; }
        .hero-bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-top: 2.4vh; overflow: hidden; }
        .hero-bar > div { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #34D399, #10B981); transition: width 1s ease; }
        .hero-foot { margin-top: 1.6vh; font-size: clamp(13px, 1.2vw, 19px); color: #AEB6C8; font-weight: 600; }
        .glow-green::after, .glow-pink::after, .glow-violet::after {
            content: ''; position: absolute; inset: auto -30% -55% auto; width: 65%; height: 90%;
            filter: blur(70px); opacity: .35; pointer-events: none;
        }
        .glow-green::after { background: #10B981; }
        .glow-pink::after { background: #EC4899; }
        .glow-violet::after { background: #8B5CF6; }

        .celebrate-emoji { font-size: clamp(30px, 2.6vw, 44px); margin-bottom: 1.2vh; }
        .celebrate-name { font-size: clamp(26px, 2.6vw, 46px); font-weight: 800; line-height: 1.15; }
        .celebrate-sub { font-size: clamp(13px, 1.15vw, 19px); color: #AEB6C8; margin-top: 1vh; font-weight: 500; }
        .fade-swap { transition: opacity .45s ease; }
        .fade-out { opacity: 0; }

        .holiday-item { display: flex; align-items: baseline; gap: 12px; padding: 1.05vh 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
        .holiday-item:last-child { border-bottom: none; }
        .holiday-date { font-size: clamp(13px, 1.1vw, 18px); font-weight: 800; color: #A5B4FC; min-width: 86px; font-variant-numeric: tabular-nums; }
        .holiday-name { font-size: clamp(15px, 1.35vw, 22px); font-weight: 600; }
        .empty-note { color: #6B7280; font-size: clamp(13px, 1.1vw, 18px); font-style: italic; }

        /* ---------- ticker ---------- */
        .ticker-wrap { flex: 0 0 auto; margin: 0 -3vw; background: linear-gradient(90deg, rgba(79,70,229,.28), rgba(147,51,234,.22)); border-top: 1px solid rgba(255,255,255,0.09); overflow: hidden; }
        .ticker-inner { display: inline-flex; white-space: nowrap; animation: scrollX 36s linear infinite; padding: 1.6vh 0; will-change: transform; }
        .ticker-wrap:hover .ticker-inner { animation-play-state: paused; }
        @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .ticker-item { display: inline-flex; align-items: center; gap: 12px; margin-right: 64px; font-size: clamp(15px, 1.35vw, 22px); font-weight: 600; }
        .ticker-tag { background: rgba(255,255,255,0.14); border-radius: 999px; padding: 3px 14px; font-size: .72em; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: #C7D2FE; }
        .ticker-empty { padding: 1.6vh 3vw; color: #6B7280; font-size: clamp(14px, 1.2vw, 20px); }

        /* ---------- QR + fullscreen ---------- */
        .qr-box { position: fixed; right: 1.4vw; bottom: calc(1.4vh + 76px); background: #fff; padding: 10px; border-radius: 14px; text-align: center; z-index: 5; }
        .qr-box canvas, .qr-box img { display: block; width: 92px; height: 92px; image-rendering: pixelated; }
        .qr-box div { color: #111827; font-size: 10px; font-weight: 700; margin-top: 5px; letter-spacing: .5px; }
        .fs-btn { position: fixed; left: 1.4vw; bottom: calc(1.4vh + 76px); z-index: 5; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); color: #AEB6C8; border-radius: 12px; padding: 9px 14px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; opacity: .55; }
        .fs-btn:hover { opacity: 1; }
        .offline-dot { position: fixed; top: 1.6vh; left: 50%; transform: translateX(-50%); background: #DC2626; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; padding: 5px 14px; border-radius: 999px; display: none; z-index: 9; }
        body.idle .fs-btn { opacity: 0; transition: opacity 1s; }
    </style>
</head>
<body>
    <div class="offline-dot" id="offlineDot">OFFLINE — RETRYING</div>

    <header>
        <div class="brand">
            <img src="/assets/images/gensar_logo.png" alt="logo" onerror="this.style.display='none'">
            <div>
                <div class="brand-name">GENSAR IT SOLUTIONS</div>
                <div class="brand-sub">Human Resource Management</div>
            </div>
        </div>
        <div class="clock-wrap">
            <div class="clock" id="clock">--:--</div>
            <div class="date-line" id="dateLine">&nbsp;</div>
        </div>
    </header>

    <main>
        <div class="card hero glow-green">
            <div class="card-label">In Office Today</div>
            <div class="hero-num"><span id="attPresent">–</span><small> / <span id="attTotal">–</span></small></div>
            <div class="hero-bar"><div id="attBar"></div></div>
            <div class="hero-foot" id="attFoot">Loading live attendance…</div>
        </div>

        <div class="card glow-pink">
            <div class="card-label">Birthday</div>
            <div class="fade-swap" id="bdayWrap">
                <div class="celebrate-emoji">🎂🎉</div>
                <div class="celebrate-name" id="bdayName">—</div>
                <div class="celebrate-sub" id="bdaySub"></div>
            </div>
        </div>

        <div class="card glow-violet">
            <div class="card-label">Work Anniversary</div>
            <div class="fade-swap" id="annWrap">
                <div class="celebrate-emoji">🏆✨</div>
                <div class="celebrate-name" id="annName">—</div>
                <div class="celebrate-sub" id="annSub"></div>
            </div>
        </div>

        <div style="grid-column: 2 / -1;" class="card">
            <div class="card-label">Upcoming Holidays</div>
            <div id="holidayList"><div class="empty-note">Loading…</div></div>
        </div>
    </main>

    <div class="ticker-wrap">
        <div class="ticker-inner" id="tickerInner">
            <span class="ticker-empty">Welcome to Gensar IT Solutions</span>
        </div>
    </div>

    <button class="fs-btn" onclick="toggleFs()">⛶ Fullscreen</button>
    <div class="qr-box" id="qrBox" title="Scan to open Gensar HRMS">
        <div id="qrcode"></div>
        <div>GENSAR HRMS</div>
    </div>

    <script>
        const IST = 'Asia/Kolkata';

        /* ---------- live clock (IST) ---------- */
        function tickClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-IN', { timeZone: IST, hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('clock').textContent = time.toUpperCase().replace(/\s/g, ' ');
            const dateStr = now.toLocaleDateString('en-IN', { timeZone: IST, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('dateLine').textContent = dateStr;
        }
        setInterval(tickClock, 1000);
        tickClock();

        /* ---------- fullscreen + idle cursor hide ---------- */
        function toggleFs() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }
        let idleTimer;
        function resetIdle() {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.body.classList.add('idle'), 6000);
        }
        ['mousemove', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, resetIdle));
        resetIdle();

        /* ---------- QR code ---------- */
        window.addEventListener('load', () => {
            try {
                if (window.QRCode) new QRCode(document.getElementById('qrcode'), {
                    text: location.origin, width: 92, height: 92, correctLevel: QRCode.CorrectLevel.M
                });
                else document.getElementById('qrBox').style.display = 'none';
            } catch (e) { document.getElementById('qrBox').style.display = 'none'; }
        });

        /* ---------- data ---------- */
        let bdays = [], anns = [], bIdx = 0, aIdx = 0;

        function swapText(idWrap, idMain, idSub, main, sub) {
            const wrap = document.getElementById(idWrap);
            wrap.classList.add('fade-out');
            setTimeout(() => {
                document.getElementById(idMain).textContent = main;
                document.getElementById(idSub).textContent = sub || '';
                wrap.classList.remove('fade-out');
            }, 450);
        }

        function rotateCelebrities() {
            if (bdays.length > 0) {
                const b = bdays[bIdx % bdays.length];
                swapText('bdayWrap', 'bdayName', 'bdaySub', b.name, 'wishing you a wonderful day!');
                bIdx++;
            }
            if (anns.length > 0) {
                const a = anns[aIdx % anns.length];
                swapText('annWrap', 'annName', 'annSub', a.name, a.years + (a.years === 1 ? ' year' : ' years') + ' at Gensar — thank you!');
                aIdx++;
            }
        }
        setInterval(rotateCelebrities, 7000);

        function fmtHolidayDate(ds) {
            const d = new Date(ds + 'T00:00:00');
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        }

        async function loadData() {
            try {
                const r = await fetch('/api/display/today');
                const d = await r.json();
                if (!d || !d.success) throw new Error('bad response');
                document.getElementById('offlineDot').style.display = 'none';

                // Attendance hero
                const pct = d.attendance.total > 0 ? Math.round((d.attendance.present / d.attendance.total) * 100) : 0;
                document.getElementById('attPresent').textContent = d.attendance.present;
                document.getElementById('attTotal').textContent = d.attendance.total;
                document.getElementById('attBar').style.width = pct + '%';
                document.getElementById('attFoot').textContent = pct + '% of the team is in today';

                // Birthdays / anniversaries
                bdays = d.birthdays || [];
                anns = d.anniversaries || [];
                bIdx = 0; aIdx = 0;
                if (bdays.length === 0) {
                    document.getElementById('bdayName').textContent = 'No birthdays';
                    document.getElementById('bdaySub').textContent = 'today';
                } else {
                    const b = bdays[0];
                    document.getElementById('bdayName').textContent = b.name;
                    document.getElementById('bdaySub').textContent = 'wishing you a wonderful day!';
                    bIdx = 1;
                }
                if (anns.length === 0) {
                    document.getElementById('annName').textContent = 'No anniversaries';
                    document.getElementById('annSub').textContent = 'today';
                } else {
                    const a = anns[0];
                    document.getElementById('annName').textContent = a.name;
                    document.getElementById('annSub').textContent = a.years + (a.years === 1 ? ' year' : ' years') + ' at Gensar — thank you!';
                    aIdx = 1;
                }

                // Holidays
                const hl = document.getElementById('holidayList');
                if ((d.upcomingHolidays || []).length === 0) {
                    hl.innerHTML = '<div class="empty-note">No upcoming holidays listed</div>';
                } else {
                    hl.innerHTML = d.upcomingHolidays.map(h =>
                        '<div class="holiday-item"><span class="holiday-date">' + fmtHolidayDate(h.date) + '</span><span class="holiday-name">' + escapeHtml(h.name) + '</span></div>'
                    ).join('');
                }

                // Ticker
                const inner = document.getElementById('tickerInner');
                const items = [];
                (d.announcements || []).forEach(a => {
                    items.push('<span class="ticker-item"><span class="ticker-tag">Notice</span>' + escapeHtml(a.title) +
                        (a.content ? ' &nbsp;—&nbsp; ' + escapeHtml(a.content) : '') + '</span>');
                });
                if (bdays.length > 0) items.push('<span class="ticker-item"><span class="ticker-tag">Today</span>🎂 Wish a happy birthday to ' + bdays.map(b => escapeHtml(b.name)).join(', ') + '!</span>');
                if (anns.length > 0) items.push('<span class="ticker-item"><span class="ticker-tag">Today</span>🏆 Celebrating ' + anns.map(a => escapeHtml(a.name) + ' (' + a.years + 'y)').join(', ') + ' work anniversary!</span>');
                if (items.length === 0) {
                    inner.innerHTML = '<span class="ticker-empty">Welcome to Gensar IT Solutions</span>';
                } else {
                    // duplicate content once so the -50% keyframe loops seamlessly
                    inner.innerHTML = items.join('') + items.join('');
                }
            } catch (e) {
                document.getElementById('offlineDot').style.display = 'block';
            }
        }
        loadData();
        setInterval(loadData, 60000);

        function escapeHtml(t) {
            return String(t === null || t === undefined ? '' : t)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
